<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" role="img" aria-label="Certiva A4 letterhead template">
  <style>@font-face{font-family:Manrope;src:url("../02-color-and-type/fonts/Manrope-wght.ttf") format("truetype");font-weight:200 800}</style>
  <title>Certiva letterhead template</title>
  <rect width="595" height="842" fill="white"/>
  <image href="data:image/png;base64," x="50" y="48" width="131" height="36" aria-label="Certiva logo"/>
  <line x1="50" y1="112" x2="545" y2="112" stroke="#BDD2C3"/>
  <text x="50" y="160" fill="#2D6A4F" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">DOCUMENT TYPE / EDITABLE</text>
  <text x="50" y="199" fill="#111827" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="700">Document title goes here</text>
  <text x="50" y="232" fill="#65786C" font-family="Manrope,Arial,sans-serif" font-size="11">Date: [DD Month YYYY]  ·  Version: [1.0]  ·  Prepared for: [Organization]</text>
  <line x1="50" y1="258" x2="545" y2="258" stroke="#E0EAE2"/>
  <text x="50" y="304" fill="#111827" font-family="Manrope,Arial,sans-serif" font-size="12">[Begin editable letter or brief here. This specimen shows hierarchy only.]</text>
  <text x="50" y="336" fill="#111827" font-family="Manrope,Arial,sans-serif" font-size="12">Use real scope, dates, people and commitments in the final document.</text>
  <line x1="50" y1="760" x2="545" y2="760" stroke="#BDD2C3"/>
  <text x="50" y="787" fill="#1A4731" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700">getcertiva.com</text>
  <text x="380" y="787" fill="#75887A" font-family="Manrope,Arial,sans-serif" font-size="9">[Legal entity, if required]</text>
  <text x="50" y="810" fill="#8C9E91" font-family="Manrope,Arial,sans-serif" font-size="9">[Confidentiality marking, if applicable]</text>
</svg>
