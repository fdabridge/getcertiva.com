<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Certiva marketing component specimens">
  <style>@font-face{font-family:Manrope;src:url("../02-color-and-type/fonts/Manrope-wght.ttf") format("truetype");font-weight:200 800}</style>
  <title>Certiva web and UI component specimens</title>
  <rect width="1440" height="900" fill="#F0FAF4"/>
  <text x="74" y="100" fill="#111827" font-family="Manrope,Arial,sans-serif" font-size="52" font-weight="750">Marketing component specimens</text>
  <text x="76" y="141" fill="#5B6E61" font-family="Manrope,Arial,sans-serif" font-size="21">Reference patterns, not automatic replacements for the live product UI.</text>
  <rect x="74" y="192" width="610" height="560" rx="28" fill="white" stroke="#CFDFD3" stroke-width="2"/>
  <text x="112" y="244" fill="#2D6A4F" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">LIGHT SURFACE</text>
  <text x="112" y="316" fill="#111827" font-family="Manrope,Arial,sans-serif" font-size="42" font-weight="750">One controlled handoff.</text>
  <text x="112" y="354" fill="#516257" font-family="Manrope,Arial,sans-serif" font-size="19">Keep the case and its prepared documents together.</text>
  <rect x="112" y="400" width="214" height="58" rx="29" fill="#1A4731"/><text x="146" y="437" fill="white" font-family="Manrope,Arial,sans-serif" font-size="18" font-weight="700">See the workflow</text>
  <text x="112" y="536" fill="#1A4731" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700">Application approved</text>
  <line x1="112" y1="561" x2="620" y2="561" stroke="#D5E4D9" stroke-width="2"/>
  <text x="112" y="604" fill="#1A4731" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700">Documents prepared</text>
  <line x1="112" y1="629" x2="620" y2="629" stroke="#D5E4D9" stroke-width="2"/>
  <text x="112" y="672" fill="#1A4731" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700">Planner review</text>
  <rect x="724" y="192" width="642" height="560" rx="28" fill="#060D08"/>
  <text x="764" y="244" fill="#52C27A" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">DARK SURFACE</text>
  <text x="764" y="316" fill="white" font-family="Manrope,Arial,sans-serif" font-size="42" font-weight="750">Proof before promise.</text>
  <text x="764" y="354" fill="#C0D0C4" font-family="Manrope,Arial,sans-serif" font-size="19">Show the actual task, then the result.</text>
  <rect x="764" y="400" width="249" height="58" rx="29" fill="#52C27A"/><text x="797" y="437" fill="#060D08" font-family="Manrope,Arial,sans-serif" font-size="18" font-weight="700">Explore the product</text>
  <rect x="764" y="519" width="556" height="153" rx="18" fill="#0D1710" stroke="#294533" stroke-width="2"/>
  <circle cx="801" cy="556" r="8" fill="#52C27A"/><text x="823" y="562" fill="white" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="700">Current case</text>
  <text x="801" y="606" fill="#D8F3DC" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="650">Document set ready for review</text>
  <text x="801" y="643" fill="#8CA996" font-family="Manrope,Arial,sans-serif" font-size="15">Illustrative component, not a product screenshot</text>
  <text x="74" y="826" fill="#5B6E61" font-family="Manrope,Arial,sans-serif" font-size="19">Use Forest for text on light. Use Signal for text on Night. Preserve contrast and focus visibility.</text>
</svg>
