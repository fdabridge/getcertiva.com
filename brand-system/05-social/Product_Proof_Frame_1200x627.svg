<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="Editable Certiva verified screenshot frame">
  <style>@font-face{font-family:Manrope;src:url("../02-color-and-type/fonts/Manrope-wght.ttf") format("truetype");font-weight:200 800}</style>
  <title>Certiva - verified product screenshot frame</title>
  <rect width="1200" height="627" fill="#060D08"/>
  <rect x="0" y="0" width="8" height="627" fill="#52C27A"/>
  <image href="data:image/png;base64," x="60" y="50" width="138" height="38" aria-label="Certiva logo"/>
  <text x="60" y="167" fill="#52C27A" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">PRODUCT DETAIL / REPLACE COPY</text>
  <text x="58" y="241" fill="white" font-family="Manrope,Arial,sans-serif" font-size="47" font-weight="750" letter-spacing="-1.5">One workflow.</text>
  <text x="58" y="299" fill="white" font-family="Manrope,Arial,sans-serif" font-size="47" font-weight="750" letter-spacing="-1.5">One clear result.</text>
  <text x="60" y="360" fill="#C8D5CB" font-family="Manrope,Arial,sans-serif" font-size="21">Replace with an accurate, specific outcome.</text>
  <text x="60" y="553" fill="white" font-family="Manrope,Arial,sans-serif" font-size="18" font-weight="600">getcertiva.com</text>
  <rect x="583" y="89" width="551" height="448" rx="24" fill="#0D1710" stroke="#3E654B" stroke-width="2" stroke-dasharray="11 9"/>
  <text x="650" y="280" fill="#D8F3DC" font-family="Manrope,Arial,sans-serif" font-size="29" font-weight="650">INSERT VERIFIED UI CROP</text>
  <text x="650" y="324" fill="#9DBCA5" font-family="Manrope,Arial,sans-serif" font-size="17">Do not publish this placeholder.</text>
  <text x="650" y="351" fill="#9DBCA5" font-family="Manrope,Arial,sans-serif" font-size="17">Clear customer data before export.</text>
</svg>
